  <!-- hidung -->
  <path d="M130 124 Q128 132 131 134" stroke="#E6A07E" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- senyum -->
  <path d="M119 140 Q130 149 141 140" stroke="#E3796B" stroke-width="3.4" fill="none" stroke-linecap="round"/>
